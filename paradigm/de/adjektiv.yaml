---
meta:
  version: 2
  språk: de
  ordklass: Adjektiv
  beskrivning: >
    Fullständigt inflektionsrum för tyska adjektiv. Tyska adjektiv deklineras
    i tre mönster beroende på föregående determinant:

      species: Obest  = Starke Deklination  (inget artikel: "großer Mann")
      species: Best   = Schwache Deklination (def. artikel: "der große Mann")
      species: Bland  = Gemischte Deklination (indef. artikel: "ein großer Mann")

    Genus i singularis:
      UtrMask = Maskulinum, NeuFem = Femininum, Alla = Neutrum (de-konvention).
    Plural: genus varierar ej — genus lämnas NULL (ej satt i cell).

    Komparativ och Superlativ följer EXAKT samma 48-cells-mönster som
    Positiv, fast med annan stam (groß → größer- → größt-).
    Celler för Komp/Superl är identiska i struktur.

    Oregelbundna: gut/besser/best-, hoch/höher/höchst-,
    nah/näher/nächst-, viel/mehr/meist-, gern/lieber/liebst-.

    Predikativ-användning (utan deklination) = Positiv-stammen utan ändelse:
    "Er ist groß". Lagras ej separat — renderaren vet att predikativ = stam.

    Aktiva axlar: genus, numerus, kasus, species, grad.
    Totalt: 3 species × (3 genus×4 kasus sg + 4 kasus pl) × 3 grad = 144 celler.

# ══════════════════════════════════════════════════════════════════════
# POSITIV
# ══════════════════════════════════════════════════════════════════════

celler:
  # ── Predikativ: OBÖJD ──
  #
  # "sie ist glücklich", "das Kind ist glücklich", "sie sind glücklich" —
  # tyskan böjer inte predikativa adjektiv alls. Formen är identisk med
  # lemmat, men den behöver ändå vara en Former-rad: den är övningsbar och
  # ska därmed vara ett kort, precis som determinerarna.
  #
  # Koordinaten är grad ensam, utan species/genus/numerus/kasus, vilket
  # skiljer den från alla 144 attributiva celler.
  - id: pred
    grad: Pos
    not: "Oböjd predikativform: 'sie ist glücklich'."

  # ── Pos / Stark / Mask sg ──────────────────────────────────────────
