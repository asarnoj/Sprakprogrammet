    Tyska relativpronomen har samma former som bestämd artikel utom i genitiv (dessen/deren) och dativ plural (denen). rel_person och rel_sak är skilda koncept men samma tyska paradigm — tyskan kongruerar med korrelatets genus, inte med person/sak.

