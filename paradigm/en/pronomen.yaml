---
meta:
  version: 2
  språk: en
  ordklass: Pronomen
  beskrivning: >
    Fullständigt inflektionsrum för engelska personliga pronomen.
    Engelska pronomen är helt suppletiva — ingen morfologisk regel förbinder
    formerna (I/me är inte avledda av varandra).

    Person och numerus är lexikala egenskaper (på Lexem-nivå, ej axlar i Former).

    Possessiverna (my/mine, her/hers) låg tidigare här som cellerna
    poss_attr/poss_pred, särskiljda via genus-axeln som godtycklig
    diskriminator. De är flyttade till ordklassen Possessiv
    (paradigm/en/possessiv.yaml), där attributiv/självständig i stället
    kodas med species-axeln — samma konvention som i fr/es. Genus-axeln
    är därmed oanvänd i engelskan.

    Aktiva axlar: kasus.

celler:
  - id: nom
    kasus: [Nom]
    # "I", "you", "he", "she", "it", "we", "they".

  - id: obl
    kasus: [Ack, Dat]
    # Oblique/objektsform: "me", "you", "him", "her", "it", "us", "them".
    # Engelska särskiljer inte ackusativ och dativ morfologiskt.
