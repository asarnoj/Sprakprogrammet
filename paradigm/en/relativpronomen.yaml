meta:
  version: 1
  språk: en
  ordklass: Relativpronomen
  beskrivning: >
    Engelska determinerare böjs nästan inte. this/that böjs i numerus (these/those); relativpronomenet who har who/whom/whose. Resten fyller bara inv. a/an är fonologiskt betingat och görs i renderaren.

celler:
