---
meta:
  version: 2
  språk: en
  ordklass: Verb
  beskrivning: >
    Fullständigt inflektionsrum för engelska verb. Engelska har minimal
    verbmorfologi — bara 5 distinkta former, varav imperativ är identisk
    med infinitiv (bitmask-OR-kollaps) och presens delar form med infinitiv
    för alla personer utom tredje person singular.

    Engelska saknar morfologisk passiv — "is spoken" är analytisk och lagras
    inte i Former. Sup-formen (past participle) används av renderaren för att
    bilda perfekt och passiv analytiskt.

    Modala hjälpverb (can, will, shall, may, might, must, should, would,
    could, ought) är defektiva — saknar inf, sup och pres_part. Markeras
    via lexem-modifierare.

    Aktiva axlar: tempus, person (bara för pres_3sg), numerus (bara för
    pres_3sg), diates.

celler:
  # ── be: engelskans enda verb med personböjning ──
  #
  # Alla andra engelska verb klarar sig med grundform och 3sg (give/gives,
  # gave). "Be" har am/is/are och was/were, och de cellerna finns bara för
  # dess skull — övriga verb lämnar dem tomma och renderaren faller
  # tillbaka på inf_imp.
  #
  # De är värda att lagra ändå: be är engelskans vanligaste verb, och
  # "are" och "were" är former en inlärare måste kunna. Utan dem gick
  # "the girls are happy" inte att bygga.
  - id: pres_1sg
    tempus: [Pres]
    person: P1
    numerus: Sg
    not: "am"
  - id: pres_2sg
    tempus: [Pres]
    person: P2
    numerus: Sg
    not: "are"
  - id: pres_1pl
    tempus: [Pres]
    person: P1
    numerus: Pl
    not: "are"
  - id: pres_2pl
    tempus: [Pres]
    person: P2
    numerus: Pl
    not: "are"
  - id: pres_3pl
    tempus: [Pres]
    person: P3
    numerus: Pl
    not: "are"
  - id: pret_2sg
    tempus: [Pret]
    person: P2
    numerus: Sg
    not: "were"
  - id: pret_1pl
    tempus: [Pret]
    person: P1
    numerus: Pl
    not: "were"
  - id: pret_2pl
    tempus: [Pret]
    person: P2
    numerus: Pl
    not: "were"
  - id: pret_3pl
    tempus: [Pret]
    person: P3
    numerus: Pl
    not: "were"

  - id: inf_imp
    tempus: [Inf, Imp]
    diates: Aktiv
    not: "Bitmask-OR-kollaps: imperativ = infinitiv för alla engelska verb."

  - id: pres_3sg
    tempus: [Pres]
    person: P3
    numerus: Sg
    diates: Aktiv
    not: "'speaks', 'runs', 'does' — den enda person-/numerus-markerade formen."

  - id: pret
    tempus: [Pret]
    diates: Aktiv
    not: "Regelbundet: +ed ('walked'). Oregelbundet: 'spoke', 'went', 'was/were'. OBS: vara har två preteritumformer (was/were). Lagras som två Lexem-rader om båda ska finnas, eller som ett med den vanligaste formen."

  - id: sup
    tempus: [Sup]
    diates: Aktiv
    not: "Past participle: 'spoken', 'walked', 'gone'. Renderaren bildar perfekt analytiskt: 'has spoken'. Samma form används för passiv: 'is spoken'."

  - id: gerund
    tempus: [Te]
    diates: Aktiv
    not: "Present participle / gerund: 'speaking', 'running'. Te-axeln används (legend: Te=128, 'Gerundium'). Renderaren bildar progressiv analytiskt: 'is speaking'."
