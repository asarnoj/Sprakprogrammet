---
meta:
  version: 2
  språk: es
  ordklass: Verb
  beskrivning: >
    Fullständigt inflektionsrum för spanska verb. Spanska böjer verb efter
    person (P1–P3), numerus (Sg/Pl), tempus och diates.

    Analytiska tider (pretérito perfecto, pluscuamperfecto, futuro perfecto,
    condicional perfecto etc.) lagras INTE — bildas av renderaren via
    auxiliar (haber) + participio pasado.

    Subjuntivo imperfecto är aktivt i modernt spanska (till skillnad från
    franskt subjonctif imparfait). Bara -ra-varianten lagras (den vanligaste);
    -se-varianten är sällsynt i talspråk.

    Imperativo: positiv imperativo finns för P2sg, P3sg (Ud.), P1pl, P2pl,
    P3pl (Uds.). Negativ imperativo = presente de subjuntivo (analytisk).

    Aktiva axlar: tempus, person, numerus, diates, genus (för participio).

celler:
