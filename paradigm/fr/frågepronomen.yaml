---
meta:
  version: 2
  språk: fr
  ordklass: Frågepronomen
  beskrivning: >
    Inflektionsrum för franska interrogativa pronomen.

    "Qui" (animate) och "que/quoi" (inanimate) böjs efter kasus.
    "Quel/quelle/quels/quelles" (vilken/vilket) böjs efter genus+numerus
    och är adjektivliknande — lagras ändå här eftersom ordklassen är
    Frågepronomen/Interrogativdeterminant.

    Aktiva axlar: kasus, genus, numerus.

celler:
  - id: nom
    kasus: [Nom]
    # "qui" (animate subj), "qu'est-ce qui" (inanimate subj → analytisk).

  - id: obl
    kasus: [Ack, Dat]
    # "qui" (animate obj), "que/quoi" (inanimate obj).
    # OBS: "qui" är identisk med nom för animata → bitmask-OR-kollaps.

  - id: quel_msc_sg
    genus: UtrMask
    numerus: Sg
    # "quel". Används som determinant ("quel livre?") och predikativt.

  - id: quel_fem_sg
    genus: NeuFem
    numerus: Sg
    # "quelle".

  - id: quel_msc_pl
    genus: UtrMask
    numerus: Pl
    # "quels".

  - id: quel_fem_pl
    genus: NeuFem
    numerus: Pl
    # "quelles".
