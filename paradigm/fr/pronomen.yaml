---
meta:
  version: 2
  språk: fr
  ordklass: Pronomen
  beskrivning: >
    Fullständigt inflektionsrum för franska personliga pronomen. Franska
    pronomen är suppletiva och har fler distinkta former än svenska.

    Former per position:
      - Sujet (subjekt): je, tu, il/elle, nous, vous, ils/elles
      - COD direkt objekt (ackusativ): me, te, le/la, nous, vous, les
      - COI indirekt objekt (dativ): me, te, lui, nous, vous, leur
      - Tonique (disjunctif, efter preposition/betonat): moi, toi, lui/elle,
        nous, vous, eux/elles

    COD och COI är identiska för P1/P2 sg och pl (me, te, nous, vous) →
    bitmask-OR-kollaps vid lagring.

    Tonique kodas med kasus=Gen som konvention (ingen semantisk genitiv
    i franska — Gen-biten används som diskriminator).

    Aktiva axlar: kasus, genus (för P3 som har m/f-distinktion).

celler:
  - id: sujet
    kasus: [Nom]
    # je, tu, il, elle, nous, vous, ils, elles.
    # P3: genus avgör il (UtrMask) / elle (NeuFem) / ils / elles.

  - id: cod
    kasus: [Ack]
    # me, te, le, la, nous, vous, les.
    # P3 sg: le (UtrMask) / la (NeuFem).

  - id: coi
    kasus: [Dat]
    # me, te, lui, nous, vous, leur.
    # P3 sg/pl: lui/leur (genus-neutralt i dativ — samma form m/f).

  - id: tonique
    kasus: [Gen]
    # moi, toi, lui, elle, nous, vous, eux, elles.
    # P3: genus avgör lui (UtrMask sg) / elle (NeuFem sg) /
    #     eux (UtrMask pl) / elles (NeuFem pl).
    # Används efter preposition ("avec moi"), vid betoning ("moi, je..."),
    # ensamt ("qui? — moi").
