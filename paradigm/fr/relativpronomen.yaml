  - id: m_sg
    genus: UtrMask
    numerus: Sg
    species: Obest
  - id: m_sg_vokal
    genus: UtrMask
    numerus: Sg
    species: Best
  - id: f_sg
    genus: NeuFem
    numerus: Sg
  - id: m_pl
    genus: UtrMask
    numerus: Pl
  - id: f_pl
    genus: NeuFem
    numerus: Pl
  - id: pl
