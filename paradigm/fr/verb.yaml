---
meta:
  version: 2
  språk: fr
  ordklass: Verb
  beskrivning: >
    Fullständigt inflektionsrum för franska verb. Franska böjer verb efter
    person (P1–P3), numerus (Sg/Pl), tempus och diates.

    Analytiska tider (passé composé, plus-que-parfait, futur antérieur,
    conditionnel passé etc.) lagras INTE i Former — de bildas av renderaren
    via auxiliaire (avoir/être) + participe passé.

    Participe passé varierar i genus och numerus vid användning med être
    och vid framförställt direkt objekt. Alla 4 former lagras (m.sg, f.sg,
    m.pl, f.pl) för oregelbundna verb; för regelbundna är f.sg = m.sg + "e",
    etc.

    Gérondif ("en parlant") = "en" + participe présent — ej separat form.

    Aktiva axlar: tempus, person, numerus, diates, genus (för participe passé).

celler:
