---
meta:
  version: 2
  språk: it
  ordklass: Adjektiv
  beskrivning: >
    Fullständigt inflektionsrum för italienska adjektiv.

    Fyra-form-adjektiv (slutar på -o): m.sg, f.sg, m.pl, f.pl.
    Två-form-adjektiv (slutar på -e): sg (m+f) / pl (m+f) — genus-neutrala.
    För tvåformiga: pos_msc_sg = pos_fem_sg → bitmask-OR-kollaps vid lagring.

    Oregelbundna komparativ/superlativ i italienska ÄR genusneutrala —
    "migliore" gäller m+f sg, "migliori" gäller m+f pl.
    Skillnad mot franska/spanska: bara 2 komp/superl-celler (sg/pl), ej 4.

    Oregelbundna: buono→migliore, cattivo→peggiore,
    grande→maggiore, piccolo→minore.

    Aktiva axlar: genus, numerus, grad.

celler:
  # ── Positiv ────────────────────────────────────────────────────────
  - id: pos_msc_sg
    genus: UtrMask
    numerus: Sg
    grad: Pos
    not: "'grande', 'piccolo', 'buono', 'bello'."

  - id: pos_fem_sg
    genus: NeuFem
    numerus: Sg
    grad: Pos
    not: "'grande' (identisk för tvåformiga), 'piccola', 'buona', 'bella'."

  - id: pos_msc_pl
    genus: UtrMask
    numerus: Pl
    grad: Pos
    not: "'grandi', 'piccoli', 'buoni', 'bei/begli'."

  - id: pos_fem_pl
    genus: NeuFem
    numerus: Pl
    grad: Pos
    not: "'grandi' (identisk för tvåformiga), 'piccole', 'buone', 'belle'."

  # ── Komparativ (bara oregelbundna, genus-neutral) ──────────────────
  - id: komp_sg
    numerus: Sg
    grad: Komp
    not: "'migliore', 'peggiore', 'maggiore', 'minore'. Gäller m+f — genus sätts ej (NULL i Former)."

  - id: komp_pl
    numerus: Pl
    grad: Komp
    not: "'migliori', 'peggiori', 'maggiori', 'minori'."

  # ── Superlativ (bara oregelbundna, genus-neutral) ──────────────────
  - id: superl_sg
    numerus: Sg
    grad: Superl
    not: "Identisk med komp för dessa oregelbundna (migliore = bäst och bättre). Superlativ uttrycks med artikel: 'il migliore'. Lagras utan artikel."

  - id: superl_pl
    numerus: Pl
    grad: Superl
    not: "'migliori' — identisk med komp pl → bitmask-OR-kollaps vid lagring."
