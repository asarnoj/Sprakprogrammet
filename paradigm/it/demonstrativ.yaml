  - id: m_sg
    genus: UtrMask
    numerus: Sg
    species: Obest
  - id: m_sg_lo
    genus: UtrMask
    numerus: Sg
    species: Best
  - id: f_sg
    genus: NeuFem
    numerus: Sg
  - id: m_pl
    genus: UtrMask
    numerus: Pl
    species: Obest
  - id: m_pl_gli
    genus: UtrMask
    numerus: Pl
    species: Best
  - id: f_pl
    genus: NeuFem
    numerus: Pl
  - id: pl
    numerus: Pl
