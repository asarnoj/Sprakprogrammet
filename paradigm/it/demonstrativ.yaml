---
meta:
  version: 1
  språk: it
  ordklass: Demonstrativ
  beskrivning: >
    Italienska determinerare böjs i genus och numerus, och maskulinum har dessutom en fonologiskt betingad allomorf: il/lo och i/gli. Den lagras med species som diskriminator (Obest = il/i, Best = lo/gli) eftersom formerna är något en inlärare måste kunna, inte något renderaren kan räkna ut ur genus och numerus ensamt.

celler:
