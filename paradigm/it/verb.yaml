---
meta:
  version: 2
  språk: it
  ordklass: Verb
  beskrivning: >
    Fullständigt inflektionsrum för italienska verb. Strukturen liknar
    spanska med congiuntivo presente och congiuntivo imperfetto båda aktiva
    i modernt italienska.

    Analytiska tider (passato prossimo, trapassato prossimo, futuro anteriore,
    condizionale passato etc.) lagras INTE — bildas analytiskt av renderaren.

    Imperativo: Italienska har P2sg, P3sg (Lei, artighetspronomenet),
    P1pl, P2pl, P3pl (Loro, formellt). P3sg Lei imperativo = congiuntivo
    presente P3sg (bitmask-OR-kollaps om formerna är identiska).

    Passivo: morfologisk passiv saknas i modernt italienska (analytisk:
    essere + participio). Passivo-celler utelämnas.

    Aktiva axlar: tempus, person, numerus, diates, genus (för participio).

celler:
