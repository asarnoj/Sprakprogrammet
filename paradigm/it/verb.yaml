  - id: pp_fem_sg
    tempus: [Sup]
    genus: NeuFem
    numerus: Sg
    diates: Aktiv
    # "parlata", "finita", "fatta".

  - id: pp_msc_pl
    tempus: [Sup]
    genus: UtrMask
    numerus: Pl
    diates: Aktiv
    # "parlati", "finiti", "fatti".

  - id: pp_fem_pl
    tempus: [Sup]
    genus: NeuFem
    numerus: Pl
    diates: Aktiv
    # "parlate", "finite", "fatte".
