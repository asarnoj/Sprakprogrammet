  ordklass: Kvantifikator
  beskrivning: >
    Kvantifikatorerna används här som indefinita pronomen (ingen=nobody, inget=nothing) och är oböjliga i den rollen. Undantaget är den negativa determineraren kvant_ingen_det, som böjs som en artikel: ingen/inget/inga.

