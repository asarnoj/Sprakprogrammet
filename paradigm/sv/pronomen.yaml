---
meta:
  version: 2
  språk: sv
  ordklass: Pronomen
  beskrivning: >
    Fullständigt inflektionsrum för svenska pronomen (ordklass Pronomen
    enligt Koncept-schemat — exkluderar Possessiv, Frågepronomen,
    Relativpronomen, Demonstrativ, Artikel, Kvantifikator, vilka är egna
    ordklasser med egna slot-filer).

    Possessiverna låg tidigare här som cellerna m_sg/f_sg/a_pl. De är
    flyttade till ordklassen Possessiv (paradigm/sv/possessiv.yaml),
    eftersom de kongruerar med det ägda substantivet och inte är
    kasusformer av pronomenet. Reflexiva sin/sitt/sina ligger där som
    andra lemma under 3:e-personskoncepten.

    Personliga pronomen (jag, du, han, hon, den, det, vi, ni, de) fyller
    nom + ack_dat. Person, numerus och genus är inneboende på Lexem-raden
    och varierar inte inom det enskilda lexemets former.

    Reflexivt pronomen (sig) är invariant — samma sträng i båda cellerna.

    Aktiva axlar: kasus.

celler:
  - id: nom
    kasus: [Nom]
    not: "Subjektsform: jag, du, han, hon, den, det, vi, ni, de."

  - id: ack_dat
    kasus: [Ack, Dat]
    not: "Objektsform: mig, dig, honom, henne, den, det, oss, er, dem."
