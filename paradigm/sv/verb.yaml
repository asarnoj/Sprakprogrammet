---
meta:
  version: 2
  språk: sv
  ordklass: Verb
  beskrivning: >
    Fullständigt inflektionsrum för svenska verb. Modern svenska böjer
    verb endast efter tempus och diates; person och numerus är
    reducerade och spelar ingen roll i Former.

    Aktiv: inf, pres, pret, sup, imp.
    Passiv (synthetisk -s-suffix): inf, pres, pret, sup. Ingen produktiv
    passiv imperativ.

    Passivcellerna har suffixet _passiv i sitt id. Cell-ID:n MÅSTE vara
    unika inom filen — de används som JSON-nycklar i LLM-svaret, och två
    celler med samma id gör att den ena tyst tappas bort (SCHEMA.md §7).

    Defektiva paradigm hanteras via lexem-modifierare:
      • Modalverb (kunna, vilja, skola, må, böra) — markeras "ingen_imp";
        pipelinen hoppar över imp-cellen för dessa lexem.
      • Deponensverb (hoppas, finnas, trivas, minnas, andas) — markeras
        "deponens"; pipelinen fyller bara passiv-cellerna och lagrar
        dem med diates=Passiv.

    Perfekt particip (stängd/stängt/stängda) böjs som adjektiv och behövs för
    analytisk passiv ("dörren är stängd") och attributiv/predikativ användning
    ("en stängd dörr"). Det skiljs från supinum (ätit, invariant) genom att
    bära genus/numerus/species — supinum har dessa NULL, participet satta.

    Aktiva axlar: tempus, diates; för perfekt particip även genus, numerus,
    species.

celler:
  # ── Aktiv ──
  - id: inf
    tempus: [Inf]
    diates: Aktiv

  - id: pres
    tempus: [Pres]
    diates: Aktiv

  - id: pret
    tempus: [Pret]
    diates: Aktiv

  - id: sup
    tempus: [Sup]
    diates: Aktiv

  - id: imp
    tempus: [Imp]
    diates: Aktiv

  # ── Passiv (synthetiskt -s-suffix) ──
  - id: inf_passiv
    tempus: [Inf]
    diates: Passiv

  - id: pres_passiv
    tempus: [Pres]
    diates: Passiv

  - id: pret_passiv
    tempus: [Pret]
    diates: Passiv

  - id: sup_passiv
    tempus: [Sup]
    diates: Passiv

  # ── Perfekt particip (böjs som adjektiv) ──
  # Skiljs från supinum via satt genus. -a-formen (Alla) täcker bestämd
  # singular + all plural: "den stängda dörren", "de stängda dörrarna".
  - id: perfpart_obest_utr_sg
    tempus: [Sup]
    genus: UtrMask
    numerus: Sg
    species: Obest
    diates: Aktiv

  - id: perfpart_obest_neu_sg
    tempus: [Sup]
    genus: NeuFem
    numerus: Sg
    species: Obest
    diates: Aktiv

  - id: perfpart_a
    tempus: [Sup]
    genus: Alla
    diates: Aktiv
