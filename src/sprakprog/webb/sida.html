<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Språkprogrammet</title>
<style>
  :root {
    --bg:#fbfaf8; --panel:#fff; --text:#1c1a17; --svag:#6b655c; --linje:#e4dfd6;
    --rätt:#1f7a4d; --fel:#b03a30; --accent:#3c4f76; --varm:#a8681f;
    --spår:#ebe6dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#161513; --panel:#1e1c1a; --text:#ece7df; --svag:#989084;
      --linje:#2f2c28; --rätt:#5fbe8b; --fel:#e08b80; --accent:#97aad6;
      --varm:#d6a05c; --spår:#2a2724;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; }
  header { border-bottom:1px solid var(--linje); padding:.6rem 1.2rem;
           display:flex; gap:.3rem; align-items:center; }
  header .titel { font-weight:600; margin-right:auto; letter-spacing:.01em; }
  nav button { font:inherit; font-size:.88rem; color:var(--svag);
               background:none; border:none; padding:.35rem .7rem;
               border-radius:6px; cursor:pointer; }
  nav button[aria-current="page"] { color:var(--text); background:var(--spår);
                                    font-weight:600; }
  nav button:disabled { opacity:.4; cursor:default; }
  main { flex:1; display:flex; justify-content:center; padding:2rem 1.2rem 4rem; }
  .kort { width:100%; max-width:42rem; }

  /* ── hem ─────────────────────────────────────────────────────── */
  .rubrik { font-size:.74rem; letter-spacing:.11em; text-transform:uppercase;
            color:var(--svag); margin:0 0 .7rem; }
  .nivåkort { border:1px solid var(--linje); background:var(--panel);
              border-radius:12px; padding:1.1rem 1.3rem; margin-bottom:1.4rem; }
  .nivårad { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.7rem; }
  .nivånr { font-size:1.5rem; font-weight:600; }
  .spår { height:7px; background:var(--spår); border-radius:99px;
          overflow:hidden; display:flex; }
  .spår i { background:var(--accent); display:block; }
  .spårtext { font-size:.83rem; color:var(--svag); margin-top:.55rem; }
  .spårtext b { color:var(--text); font-weight:600; }
  .klar { color:var(--rätt); font-weight:600; }

  table { width:100%; border-collapse:collapse; font-size:.92rem;
          margin-bottom:1.5rem; }
  th, td { text-align:right; padding:.42rem .3rem; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
             color:var(--svag); font-weight:600;
             border-bottom:1px solid var(--linje); }
  tbody tr:last-child td { border-top:1px solid var(--linje); font-weight:600;
                           padding-top:.55rem; }
  td.noll { color:var(--svag); }
  .ny { color:var(--accent); } .förf { color:var(--varm); }
  .igen { color:var(--fel); }

  button.stor { font:inherit; font-size:1.02rem; font-weight:600;
                color:var(--bg); background:var(--accent); border:none;
                border-radius:9px; padding:.75rem 1.5rem; cursor:pointer; }
  button.stor.tom { background:var(--spår); color:var(--svag); }
  button.andra { font:inherit; font-size:.9rem; color:var(--accent);
                 background:none; border:1px solid var(--linje);
                 border-radius:9px; padding:.7rem 1.1rem; cursor:pointer; }
  .knappar { display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; }
  .knappar small { color:var(--svag); font-size:.83rem; }

  /* ── övning ──────────────────────────────────────────────────── */
  .status { display:flex; gap:1.1rem; font-size:.8rem; color:var(--svag);
            margin-bottom:1.6rem; }
  .status b { color:var(--text); }
  .riktning { font-size:.74rem; letter-spacing:.11em; text-transform:uppercase;
              color:var(--svag); margin-bottom:.5rem; }
  .uppgift { font-size:1.75rem; line-height:1.3; margin:0 0 1.5rem;
             font-weight:500; }
  input[type=text] { width:100%; padding:.8rem .9rem; font-size:1.2rem;
                     font-family:inherit; color:var(--text);
                     background:var(--panel); border:1px solid var(--linje);
                     border-radius:8px; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  input[type=text]:disabled { opacity:.65; }
  .utfall { margin-top:1.3rem; }
  .dom { font-size:1.1rem; font-weight:600; }
  .dom.ja { color:var(--rätt); } .dom.nej { color:var(--fel); }
  .facit { font-size:1.3rem; margin:.45rem 0 0; }
  ul.anm { list-style:none; padding:0; margin:.9rem 0 0;
           border-top:1px solid var(--linje); }
  ul.anm li { padding:.5rem 0; border-bottom:1px solid var(--linje);
              font-size:.9rem; display:flex; gap:.5rem; flex-wrap:wrap;
              align-items:baseline; }
  .ord { font-weight:600; }
  .ord.skrev { color:var(--fel); text-decoration:line-through; }
  .ord.väntat { color:var(--rätt); }
  .varför { color:var(--svag); }
  .osäker { font-size:.72rem; border:1px solid var(--linje); border-radius:99px;
            padding:.05rem .5rem; color:var(--varm); }
  .hjälp { margin-top:1.3rem; font-size:.85rem; color:var(--svag); }
  kbd { font:inherit; font-size:.8rem; border:1px solid var(--linje);
        border-bottom-width:2px; border-radius:4px; padding:.05rem .35rem;
        background:var(--panel); }
  .mitten { text-align:center; color:var(--svag); }

  /* ── ordboken ────────────────────────────────────────────────── */
  .filter { display:flex; gap:.6rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .filter input, .filter select { font:inherit; font-size:.9rem; padding:.45rem .6rem;
      border:1px solid var(--linje); border-radius:7px;
      background:var(--panel); color:var(--text); }
  .filter input { flex:1; min-width:9rem; }
  ul.ordlista { list-style:none; padding:0; margin:0; }
  ul.ordlista li { display:flex; gap:.8rem; align-items:center; padding:.5rem .3rem;
      border-bottom:1px solid var(--linje); cursor:pointer; }
  ul.ordlista li:hover { background:var(--spår); }
  ul.ordlista .lem { font-weight:600; flex:1; }
  ul.ordlista .kl { font-size:.78rem; color:var(--svag); }
  ul.ordlista .mini { width:64px; height:6px; background:var(--spår);
      border-radius:99px; overflow:hidden; }
  ul.ordlista .mini i { display:block; height:100%; background:var(--rätt); }

  .ordrubrik { display:flex; align-items:baseline; gap:.7rem; margin-bottom:1.2rem; }
  .ordrubrik h2 { margin:0; font-size:1.6rem; }
  .ordrubrik .kl { color:var(--svag); font-size:.9rem; }
  .paradigm { margin-bottom:1.6rem; }
  .paradigm h3 { font-size:.74rem; letter-spacing:.09em; text-transform:uppercase;
      color:var(--svag); margin:0 0 .45rem; font-weight:600; }
  table.para { border-collapse:separate; border-spacing:3px; font-size:.9rem; }
  table.para th { font-size:.7rem; letter-spacing:.05em; color:var(--svag);
      font-weight:600; padding:.1rem .4rem; text-align:center; white-space:nowrap; }
  table.para th.rad { text-align:right; }
  /* Modifierarna kvalificeras med table.para — annars vinner basregeln på
     specificitet (0,1,2 mot 0,1,1) och alla rutor blir lika. */
  table.para td { padding:.35rem .6rem; border-radius:6px; text-align:center;
      white-space:nowrap; background:var(--spår); cursor:default;
      border:1px solid transparent; }
  table.para td.utanför { background:none; border-color:transparent;
      color:var(--svag); opacity:.45; }
  table.para td.oöppnad { background:none; border:1px dashed var(--linje);
      color:var(--text); }
  table.para td.delvis { background:linear-gradient(135deg,
      color-mix(in srgb, var(--rätt) 26%, transparent) 50%, transparent 50%);
      border:1px dashed var(--linje); }
  table.para td.stark { background:color-mix(in srgb, var(--rätt) 30%, transparent); }
  table.para td.medel { background:color-mix(in srgb, var(--varm) 32%, transparent); }
  table.para td.svag  { background:color-mix(in srgb, var(--fel) 28%, transparent); }
  .delar { font-size:.82rem; color:var(--svag); min-height:1.4rem;
      border-top:1px solid var(--linje); padding-top:.7rem; margin-top:.4rem; }
  .delar b { color:var(--text); }
  .legend { display:flex; gap:.9rem; font-size:.76rem; color:var(--svag);
      margin:.2rem 0 1.3rem; flex-wrap:wrap; align-items:center; }
  .legend i { display:inline-block; width:.85rem; height:.85rem; border-radius:3px;
      vertical-align:-2px; margin-right:.25rem; }
</style>
</head>
<body>
<header>
  <span class="titel" id="titel">…</span>
  <nav>
    <button id="nav-hem" aria-current="page">Home</button>
    <button id="nav-ord" disabled>Dictionary</button>
    <button id="nav-stat" disabled>Progress</button>
    <button id="nav-lekt" disabled>Lessons</button>
  </nav>
</header>

<main><div class="kort">

  <section id="vy-hem" hidden>
    <div class="nivåkort">
      <div class="nivårad">
        <span class="rubrik" style="margin:0">Level</span>
        <span class="nivånr" id="nivå">–</span>
        <span style="color:var(--svag)">of <span id="nivåer">21</span></span>
      </div>
      <div class="spår"><i id="stapel" style="width:0"></i></div>
      <p class="spårtext" id="spårtext"></p>
    </div>

    <p class="rubrik">Today</p>
    <table>
      <thead><tr><th>Card type</th><th>New</th><th>Due</th><th>Retry</th></tr></thead>
      <tbody id="räknare"></tbody>
    </table>

    <div class="knappar">
      <button class="stor" id="starta">Start today's practice</button>
      <button class="andra" id="extra">Extra practice</button>
      <small id="hemhjälp"></small>
    </div>
  </section>

  <section id="vy-ord" hidden>
    <div id="ordlistan">
      <div class="filter">
        <input type="search" id="sök" placeholder="Search words…">
        <select id="ordklass"><option value="">All word classes</option></select>
        <select id="tillstånd">
          <option value="">All</option>
          <option value="påbörjad">Started</option>
          <option value="ny">Not started</option>
        </select>
      </div>
      <ul class="ordlista" id="orden"></ul>
    </div>
    <div id="ordet" hidden>
      <div class="ordrubrik">
        <h2 id="o-lemma"></h2><span class="kl" id="o-klass"></span>
        <button class="andra" id="o-tillbaka" style="margin-left:auto">Back</button>
      </div>
      <div class="legend">
        <span><i style="background:color-mix(in srgb,var(--rätt) 26%,transparent)"></i>strong</span>
        <span><i style="background:color-mix(in srgb,var(--varm) 26%,transparent)"></i>shaky</span>
        <span><i style="background:color-mix(in srgb,var(--fel) 24%,transparent)"></i>weak</span>
        <span><i style="background:linear-gradient(135deg,color-mix(in srgb,var(--rätt) 26%,transparent) 50%,transparent 50%);border:1px dashed var(--linje)"></i>partly known</span>
        <span><i style="border:1px dashed var(--linje)"></i>not met yet</span>
        <span><i style="border:1px solid var(--linje);opacity:.4"></i>not in your course yet</span>
      </div>
      <div id="paradigm"></div>
      <p class="delar" id="delar">Hover a form to see which cards carry it.</p>
    </div>
  </section>

  <section id="vy-öva" hidden>
    <div class="status">
      <span>done <b id="s-gjort">0</b></span>
      <span>due <b id="s-förf">0</b></span>
      <span>retry <b id="s-igen">0</b></span>
      <span id="s-extra"></span>
    </div>
    <div id="fråga" hidden>
      <div class="riktning" id="riktning"></div>
      <p class="uppgift" id="uppgift"></p>
      <form id="frm" autocomplete="off">
        <input type="text" id="svar" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="Type the sentence…">
      </form>
      <div class="utfall" id="utfall" hidden>
        <div class="dom" id="dom"></div>
        <p class="facit" id="facitrad"></p>
        <ul class="anm" id="anm"></ul>
      </div>
      <p class="hjälp" id="hjälp"><kbd>Enter</kbd> to answer</p>
      <button class="stor" id="vidare" hidden>Next sentence</button>
    </div>
    <div id="klart" hidden>
      <p class="dom ja" style="font-size:1.3rem">✓ Session complete</p>
      <p id="klarttext" style="color:var(--svag)"></p>
      <button class="stor" id="tillbaka">Back to home</button>
    </div>
  </section>

  <p class="mitten" id="laddar">Loading…</p>
</div></main>

<script>
// All gränssnittstext samlad. Programspråket är INTE kursens källspråk —
// en svensk som lär sig tyska kan vilja ha engelskt gränssnitt. När fler
// språk läggs till blir det här en kolumn per språk, inget annat ändras.
const T = {
  klart_alla:   n => `${n} sentences. Everything due today is done.`,
  klart_extra:  n => `${n} sentences of extra practice.`,
  inget_att_gora: "Nothing due — come back tomorrow, or do extra practice.",
  redo:         (f, n) => `${f} due, ${n} new`,
  plats:        (k, c) => `Ready for the next level — ${k} of ${c} sentences a day`,
  belastning:   (k, c) => `${k} of ${c} sentences a day at this pace`,
  oövad:        "Practise a little and the pace shows up here",
  totalt:       "All types",
};

const $ = id => document.getElementById(id);
let kurs = null, uppgift = null, gjort = 0, extraläge = false;

async function hämta(v, i) {
  const r = await fetch(v, i);
  if (!r.ok && ![404, 410, 503].includes(r.status)) throw new Error(r.status);
  return r.json();
}
const visa = (...vyer) => {
  for (const v of ["hem", "ord", "öva"]) $("vy-" + v).hidden = !vyer.includes(v);
  for (const [id, v] of [["nav-hem","hem"], ["nav-ord","ord"]])
    $(id).setAttribute("aria-current", vyer.includes(v) ? "page" : "false");
  $("laddar").hidden = true;
};

// ── hem ───────────────────────────────────────────────────────────
async function hem() {
  const h = await hämta(`/api/hem/${kurs.id}`);
  $("nivå").textContent = h.nivå;
  $("nivåer").textContent = h.nivåer;
  $("stapel").style.width = `${h.nivå / h.nivåer * 100}%`;
  $("spårtext").innerHTML = h.krävs === null ? T.oövad
    : h.plats ? `<span class="klar">${T.plats(h.krävs.toFixed(0), h.kapacitet)}</span>`
              : T.belastning(`<b>${h.krävs.toFixed(0)}</b>`, h.kapacitet);

  const kropp = $("räknare");
  kropp.innerHTML = "";
  const rad = (namn, r, fet) => {
    const tr = document.createElement("tr");
    for (const [text, kl] of [[namn, ""], [r.nya, "ny"], [r.förfallna, "förf"],
                              [r.igen, "igen"]]) {
      const td = document.createElement("td");
      td.textContent = text;
      if (kl) td.className = text === 0 ? "noll" : kl;
      tr.append(td);
    }
    kropp.append(tr);
  };
  for (const r of h.rader) rad(r.namn, r);
  rad(T.totalt, h.summa, true);

  const attGöra = h.summa.förfallna + h.summa.igen;
  const s = $("starta");
  s.textContent = attGöra || h.summa.nya ? "Start today's practice" : "Nothing due";
  s.disabled = !(attGöra || h.summa.nya);
  s.classList.toggle("tom", s.disabled);
  $("hemhjälp").textContent = attGöra || h.summa.nya
    ? T.redo(h.summa.förfallna + h.summa.igen, h.summa.nya) : T.inget_att_gora;
  visa("hem");
}

// ── ordboken ──────────────────────────────────────────────────────
let ordlista = null;

async function ordbok() {
  if (!ordlista) ordlista = await hämta(`/api/ordlista/${kurs.id}`);
  const klasser = [...new Set(ordlista.map(o => o.ordklass))].sort();
  const sel = $("ordklass");
  if (sel.options.length === 1)
    for (const k of klasser) sel.add(new Option(k, k));
  $("ordet").hidden = true; $("ordlistan").hidden = false;
  ritaLista();
  visa("ord");
}

function ritaLista() {
  const q = $("sök").value.trim().toLowerCase();
  const kl = $("ordklass").value, till = $("tillstånd").value;
  const ul = $("orden");
  ul.innerHTML = "";
  const träffar = ordlista.filter(o =>
    (!q || o.lemma.toLowerCase().includes(q) || o.koncept.includes(q)) &&
    (!kl || o.ordklass === kl) &&
    (!till || (till === "påbörjad" ? o.sedda > 0 : o.sedda === 0)));
  for (const o of träffar.slice(0, 400)) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="lem"></span><span class="kl"></span>
      <span class="mini"><i style="width:${Math.round(o.andel*100)}%"></i></span>`;
    li.querySelector(".lem").textContent = o.lemma;
    li.querySelector(".kl").textContent = o.ordklass;
    li.addEventListener("click", () => ordet(o.koncept));
    ul.append(li);
  }
  if (!träffar.length) ul.innerHTML = "<li style=\"color:var(--svag)\">No matches</li>";
}

async function ordet(koncept) {
  const d = await hämta(`/api/ord/${kurs.id}/${encodeURIComponent(koncept)}`);
  $("o-lemma").textContent = d.lemma;
  $("o-klass").textContent = d.ordklass;
  const rot = $("paradigm");
  rot.innerHTML = "";
  for (const t of d.tabeller) {
    const box = document.createElement("div");
    box.className = "paradigm";
    if (t.rubrik) { const h = document.createElement("h3");
                    h.textContent = t.rubrik; box.append(h); }
    const tab = document.createElement("table");
    tab.className = "para";
    if (t.kolumner.some(k => k)) {
      const tr = document.createElement("tr");
      tr.append(document.createElement("th"));
      for (const k of t.kolumner) {
        const th = document.createElement("th"); th.textContent = k; tr.append(th); }
      tab.append(tr);
    }
    for (const r of t.rader) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.className = "rad"; th.textContent = r.etikett; tr.append(th);
      for (const ruta of r.rutor) {
        const td = document.createElement("td");
        if (!ruta) { td.className = "utanför"; td.textContent = ""; }
        else {
          td.textContent = ruta.form || "—";
          td.className = ruta.styrka === null ? "utanför"
            : ruta.delvis ? "delvis"
            : ruta.outforskad ? "oöppnad"
            : ruta.styrka >= 0.9 ? "stark" : ruta.styrka >= 0.7 ? "medel" : "svag";
          td.addEventListener("mouseenter", () => beskriv(ruta));
        }
        tr.append(td);
      }
      tab.append(tr);
    }
    box.append(tab); rot.append(box);
  }
  $("ordlistan").hidden = true; $("ordet").hidden = false;
}

function beskriv(ruta) {
  const d = $("delar");
  if (!ruta.delar.length) {
    d.textContent = `${ruta.form} — not part of your course yet.`; return; }
  const bit = x => `${x.typ} <b>${x.facit}</b>` +
    (x.sedd ? ` ${Math.round(x.r*100)}%` : " not met");
  d.innerHTML = `<b>${ruta.form}</b> — ` + ruta.delar.map(bit).join(" + ")
    + (ruta.not ? `<br>${ruta.not}` : "");
}

// ── övning ────────────────────────────────────────────────────────
async function startaPass(extra) {
  extraläge = extra;
  gjort = 0;
  if (!extra) await hämta(`/api/nytt-pass/${kurs.id}`);
  $("s-extra").textContent = extra ? "extra practice" : "";
  $("klart").hidden = true;
  visa("öva");
  await nästa();
}

async function nästa() {
  $("utfall").hidden = true;
  $("anm").innerHTML = "";
  const h = await hämta(`/api/hem/${kurs.id}`);
  $("s-gjort").textContent = gjort;
  $("s-förf").textContent = h.summa.förfallna;
  $("s-igen").textContent = h.summa.igen;
  // Passet är slut när det förfallna OCH passkön är tomma. Nya kort
  // hindrar inte slutet — de möts inuti meningar, inte som en egen kö.
  if (!extraläge && !h.summa.förfallna && !h.summa.igen && gjort > 0) {
    $("fråga").hidden = true; $("klart").hidden = false;
    $("klarttext").textContent = T.klart_alla(gjort);
    return;
  }
  const u = await hämta(`/api/uppgift/${kurs.id}`);
  if (u.fel) { $("fråga").hidden = true; $("klart").hidden = false;
               $("klarttext").textContent = u.fel; return; }
  uppgift = u;
  $("fråga").hidden = false;
  $("riktning").textContent = `${u.källspråk} → ${u.målspråk}`;
  $("uppgift").textContent = u.uppgift ?? "(course has no source language)";
  const f = $("svar");
  f.value = ""; f.disabled = false; f.focus();
  $("hjälp").hidden = false; $("vidare").hidden = true;
}

async function svara() {
  const f = $("svar");
  if (!f.value.trim()) return;
  f.disabled = true;
  const r = await hämta("/api/svar", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: uppgift.id, svar: f.value})});
  gjort++;
  $("utfall").hidden = false;
  const d = $("dom");
  d.className = "dom " + (r.korrekt ? "ja" : "nej");
  d.textContent = r.korrekt ? "✓ Correct" : "✗ Not quite";
  $("facitrad").textContent = r.korrekt ? "" : r.facit;
  for (const a of r.anmärkningar) {
    const li = document.createElement("li");
    const del = (kl, txt) => { if (!txt) return;
      const e = document.createElement("span"); e.className = kl;
      e.textContent = txt; li.append(e); };
    del("ord skrev", a.skrev); del("ord väntat", a.väntat);
    del("varför", a.slutsats); if (a.osäker) del("osäker", "uncertain");
    $("anm").append(li);
  }
  $("s-gjort").textContent = gjort;
  $("s-igen").textContent = r.igen;
  $("hjälp").hidden = true;
  $("vidare").hidden = false;
  $("vidare").focus();
}
