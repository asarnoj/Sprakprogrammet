<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Språkprogrammet</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --text: #1c1a17; --svag: #6b655c;
    --linje: #e4dfd6; --rätt: #1f7a4d; --fel: #b03a30; --accent: #3c4f76;
    --stretch: #a8681f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151300; --bg: #161513; --panel: #1e1c1a; --text: #ece7df;
      --svag: #989084; --linje: #2f2c28; --rätt: #5fbe8b; --fel: #e08b80;
      --accent: #97aad6; --stretch: #d6a05c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--linje); padding: .7rem 1.2rem;
    display: flex; gap: 1.4rem; align-items: baseline; flex-wrap: wrap;
    font-size: .82rem; color: var(--svag);
  }
  header b { color: var(--text); font-weight: 600; }
  header .kurs { font-size: 1rem; color: var(--text); font-weight: 600;
                 margin-right: auto; letter-spacing: .01em; }
  main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 2rem 1.2rem 4rem;
  }
  .kort { width: 100%; max-width: 40rem; }
  .riktning { font-size: .74rem; letter-spacing: .11em; text-transform: uppercase;
              color: var(--svag); margin-bottom: .5rem; }
  .uppgift { font-size: 1.75rem; line-height: 1.3; margin: 0 0 1.6rem;
             font-weight: 500; }
  input[type=text] {
    width: 100%; padding: .8rem .9rem; font-size: 1.2rem; font-family: inherit;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--linje); border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=text]:disabled { opacity: .65; }
  .utfall { margin-top: 1.4rem; }
  .dom { font-size: 1.15rem; font-weight: 600; display: flex;
         align-items: baseline; gap: .6rem; }
  .dom.ja { color: var(--rätt); } .dom.nej { color: var(--fel); }
  .facit { font-size: 1.3rem; margin: .5rem 0 0; }
  .facit s { color: var(--svag); text-decoration-color: var(--fel); }
  ul.anm { list-style: none; padding: 0; margin: 1rem 0 0;
           border-top: 1px solid var(--linje); }
  ul.anm li { padding: .55rem 0; border-bottom: 1px solid var(--linje);
              font-size: .9rem; display: flex; gap: .55rem; flex-wrap: wrap;
              align-items: baseline; }
  .ord { font-weight: 600; }
  .ord.skrev { color: var(--fel); text-decoration: line-through; }
  .ord.väntat { color: var(--rätt); }
  .varför { color: var(--svag); }
  .osäker { font-size: .72rem; border: 1px solid var(--linje); border-radius: 99px;
            padding: .05rem .5rem; color: var(--stretch); }
  .nästa { margin-top: 1.5rem; font-size: .85rem; color: var(--svag); }
  kbd { font: inherit; font-size: .8rem; border: 1px solid var(--linje);
        border-bottom-width: 2px; border-radius: 4px; padding: .05rem .35rem;
        background: var(--panel); }
  .tomt { color: var(--svag); text-align: center; }
  button.vidare {
    margin-top: .2rem; font: inherit; font-size: .95rem; font-weight: 500;
    color: var(--bg); background: var(--accent); border: none;
    border-radius: 7px; padding: .55rem 1.1rem; cursor: pointer;
  }
  button.vidare:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <span class="kurs" id="kurs">…</span>
  <span>idag <b id="idag">0</b>/<span id="mål">0</span></span>
  <span>fel <b id="fel">0</b> mot <b id="väntat">0</b> väntade</span>
  <span>nivå <b id="nivå">–</b></span>
  <span id="plats"></span>
</header>

<main>
  <div class="kort" id="kort">
    <p class="tomt" id="tomt">Laddar …</p>

    <div id="fråga" hidden>
      <div class="riktning" id="riktning"></div>
      <p class="uppgift" id="uppgift"></p>
      <form id="frm" autocomplete="off">
        <input type="text" id="svar" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="Skriv meningen …">
      </form>

      <div class="utfall" id="utfall" hidden>
        <div class="dom" id="dom"></div>
        <p class="facit" id="facitrad"></p>
        <ul class="anm" id="anm"></ul>
      </div>

      <p class="nästa" id="hjälp"><kbd>Enter</kbd> för att svara</p>
      <button id="vidare" class="vidare" hidden>Nästa mening</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let kurs = null, uppgift = null;

const text = (el, v) => { el.textContent = v; };

async function hämta(väg, init) {
  const r = await fetch(väg, init);
  if (!r.ok && r.status !== 503 && r.status !== 410) throw new Error(r.status);
  return r.json();
}

async function start() {
  const kurser = await hämta('/api/kurser');
  if (!kurser.length) {
    text($('tomt'), 'Ingen kurs finns. Skapa en med `ordbok kurs --ny sv de`.');
    return;
  }
  kurs = kurser[0];
  text($('kurs'), `${kurs.källspråk} → ${kurs.målspråk}`);
  await läge();
  await nästa();
}

async function läge() {
  const l = await hämta(`/api/läge/${kurs.id}`);
  text($('idag'), l.idag); text($('mål'), l.mål);
  text($('fel'), l.fel); text($('väntat'), l.förväntat);
  text($('nivå'), l.nivå);
  text($('plats'), l.krävs === null ? 'oövad'
    : l.plats ? `✓ plats för nästa nivå (${l.krävs.toFixed(0)} av ${l.kapacitet}/dag)`
              : `belastning ${l.krävs.toFixed(0)} av ${l.kapacitet} meningar/dag`);
}

async function nästa() {
  $('utfall').hidden = true;
  $('anm').innerHTML = '';
  const u = await hämta(`/api/uppgift/${kurs.id}`);
  if (u.fel) { text($('tomt'), u.fel); $('fråga').hidden = true; return; }
  uppgift = u;
  $('tomt').hidden = true; $('fråga').hidden = false;
  text($('riktning'), `${u.källspråk} → ${u.målspråk}`);
  text($('uppgift'), u.uppgift ?? '(kursen saknar källspråk)');
  const f = $('svar');
  f.value = ''; f.disabled = false; f.focus();
  $('hjälp').hidden = false;
  $('vidare').hidden = true;
}

async function svara() {
  const f = $('svar');
  if (!f.value.trim()) return;
  f.disabled = true;
  const r = await hämta('/api/svar', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: uppgift.id, svar: f.value})
  });
  visa(r);
  await läge();
  // Fokus flyttas till knappen, så Enter går vidare utan att musen behövs.
  $('hjälp').hidden = true;
  $('vidare').hidden = false;
  $('vidare').focus();
}

function visa(r) {
  $('utfall').hidden = false;
  const d = $('dom');
  d.className = 'dom ' + (r.korrekt ? 'ja' : 'nej');
  text(d, r.korrekt ? '✓ Rätt' : '✗ Fel');
  $('facitrad').textContent = r.korrekt ? '' : r.facit;
  for (const a of r.anmärkningar) {
    const li = document.createElement('li');
    if (a.skrev) {
      const s = document.createElement('span');
      s.className = 'ord skrev'; s.textContent = a.skrev; li.append(s);
    }
    const v = document.createElement('span');
    v.className = 'ord väntat'; v.textContent = a.väntat; li.append(v);
    const w = document.createElement('span');
    w.className = 'varför'; w.textContent = a.slutsats; li.append(w);
    if (a.osäker) {
      const o = document.createElement('span');
      o.className = 'osäker'; o.textContent = 'osäker'; li.append(o);
    }
    $('anm').append(li);
  }
}

$('frm').addEventListener('submit', e => { e.preventDefault(); svara(); });
$('vidare').addEventListener('click', () => nästa());

start().catch(e => text($('tomt'), 'Servern svarade inte: ' + e.message));
</script>
</body>
</html>
